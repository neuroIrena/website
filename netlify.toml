# Netlify reads this file on every deploy.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.21.0"

# Old WordPress addresses, so existing links and search results keep working.
[[redirects]]
  from = "/talks/*"
  to = "/cv/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/research/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/research/"
  status = 301

[[redirects]]
  from = "/2023/11/24/how-the-heart-brain-coupling-supports-time-perception/*"
  to = "/research/"
  status = 301

[[redirects]]
  from = "/2025/05/13/perceived-time-expands-and-contracts-within-each-heartbeat/*"
  to = "/research/"
  status = 301

[[redirects]]
